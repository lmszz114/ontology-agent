[project]
name = "ontology-agent"
version = "0.1.0"
description = "온톨로지 기반 장애 진단 에이전트 (가상 MMORPG 운영 조직)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.13.0",
    "langfuse>=5.2.0",
    "langgraph==1.2.24",
    "mcp>=2.3",
    "neo4j>=5.26",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: 실행 중인 Neo4j가 필요한 테스트",
]
