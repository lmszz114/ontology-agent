# 판정 근거 15개 (설계 3단계 6장).
# tool: 모의 도구(MCP)의 조회 기능 이름. 가상 데이터를 돌려준다.
# performed_by: agent 또는 human
# judged_by_team: 에이전트가 조회하고 최종 판단은 이 팀이 한다
# performed_by_team: 사람이 수행할 때 맡는 팀
# source_systems: 데이터 출처 시스템
#
# params: 조회할 때 넘기는 값. kind: system이면 시스템 ID, values가 있으면 그중 하나
#   values가 "값: 이름" 꼴이면 이름이 응답 문장의 {인자 이름} 자리에 들어간다
# observations: 조회 결과를 나타내는 필드
#   values: 허용 값과, 그 값일 때 모의 도구가 돌려주는 기본 문장. {system}은 시스템 이름으로 바뀐다
#   한 판정 근거의 필드들은 서로 독립이어야 한다. 한 필드의 값에 따라 뜻이 없어지는 필드를 두지 않는다
#   default: 시나리오가 따로 정하지 않았을 때의 값 (이상 없음)
# 필드 값은 원인의 확정 조건(causes.yaml의 when)과 시나리오 검증에 쓴다.
# 진단 에이전트에게는 문장만 돌려주고 필드 값은 보여주지 않는다.
# 필드와 값은 확정 조건 문장의 형태로 검토했다 (2026-11-23). 실제 운영 데이터로 확인한 구분이 아니다.
evidence_checks:
  - id: E01
    name: 결제 기록 조회
    tool: query_payment_record
    performed_by: agent
    source_systems: [SY02]
    observations:
      approval:
        default: present
        values:
          present: 결제 승인 기록이 있다
          absent: 결제 승인 기록이 없다
          error: 결제 승인 기록에 오류가 남아 있다
  - id: E02
    name: "우편함, 보상 지급 기록 조회"
    tool: query_mailbox_log
    performed_by: agent
    source_systems: [SY13, SY03]
    observations:
      delivery:
        default: normal
        values:
          normal: 우편함 지급 기록이 정상으로 남아 있다
          absent: 우편함 지급 기록이 없다
          mismatch: "지급 기록이 설정된 보상과 다르다 (누락 또는 중복)"
  - id: E03
    name: 다른 타이틀 로그인 상태 확인
    tool: check_cross_title_login
    performed_by: agent
    source_systems: [SY01, SY04]
    observations:
      other_titles:
        default: normal
        values:
          normal: 다른 타이틀 로그인은 정상이다
          failing: 다른 타이틀에서도 로그인이 실패한다
  - id: E04
    name: 서버 오류 로그 조회
    tool: query_server_log
    performed_by: agent
    source_systems: [SY03]
    params:
      system: {kind: system}
    observations:
      error_log:
        default: absent
        values:
          absent: "{system}에 증상과 관련된 오류 로그가 없다"
          present: "{system}에 증상과 관련된 오류 로그가 있다"
      delay_log:
        default: absent
        values:
          absent: "{system}에 처리 지연 로그가 없다"
          present: "{system}에 특정 콘텐츠 처리 지연 로그가 있다"
  - id: E05
    name: 게임 데이터 테이블 변경 이력 조회
    tool: query_table_change
    performed_by: agent
    source_systems: [SY17]
    params:
      area:
        values: {content: 콘텐츠 영역, probability: 확률 영역}
    observations:
      changed:
        default: "no"
        values:
          "no": "증상 시작 전에 게임 데이터 테이블 {area}의 변경 이력이 없다"
          "yes": "증상 시작 전에 게임 데이터 테이블 {area}의 변경 이력이 있다"
  - id: E06
    name: 배포 이력 조회
    tool: query_deploy_history
    performed_by: agent
    source_systems: [SY08, SY03]
    params:
      system: {kind: system}
    observations:
      # 배포 여부와 결과를 한 필드에 둔다. 따로 두면 "이력이 없다"와 "배포가 실패했다"가 함께 나올 수 있다
      deploy:
        default: none
        values:
          none: "증상 시작 전에 {system} 배포 이력이 없다"
          success: "증상 시작 전에 {system} 배포 이력이 있다. 가장 최근 배포는 정상으로 끝났다"
          partial: "증상 시작 전에 {system} 배포 이력이 있다. 가장 최근 배포가 일부 대상에만 적용됐다"
          failed: "증상 시작 전에 {system} 배포 이력이 있다. 가장 최근 배포가 실패했다"
  - id: E07
    name: "설정 변경 이력 조회 (이벤트, 상품)"
    tool: query_config_change
    performed_by: agent
    source_systems: [SY15, SY12]
    params:
      system: {values: [SY12, SY15]}
    observations:
      changed:
        default: "no"
        values:
          "no": "증상 시작 전에 {system} 설정 변경 이력이 없다"
          "yes": "증상 시작 전에 {system} 설정 변경 이력이 있다"
  - id: E08
    name: "공개 수치, 테이블 수치, 실제 결과 비교"
    tool: compare_probability
    performed_by: agent
    source_systems: [SY21, SY17, SY03]
    observations:
      public_vs_table:
        default: same
        values:
          same: 공개 수치와 테이블 수치가 같다
          different: 공개 수치와 테이블 수치가 다르다
      table_vs_actual:
        default: same
        values:
          same: 테이블 수치와 실제 결과가 같다
          different: 테이블 수치와 실제 결과가 다르다
  - id: E09
    name: "자원, 네트워크 지표 조회"
    tool: query_resource_metrics
    performed_by: agent
    source_systems: [SY04, SY05]
    params:
      system: {values: [SY05, SY11]}
    observations:
      # 자원과 네트워크가 동시에 이상인 상황은 적을 수 없다. 필요해지면 필드를 나눈다
      status:
        default: normal
        values:
          normal: "{system}의 자원, 네트워크 지표가 정상 범위다"
          resource_limit: "{system}의 자원 지표가 한계에 가깝거나 넘었다. 네트워크 지표는 정상이다"
          network_fault: "{system}의 네트워크 지표가 비정상이다. 자원에는 여유가 있다"
  - id: E10
    name: 재화 유통량 규모 산정
    tool: query_currency_supply
    performed_by: agent
    judged_by_team: TM02
    source_systems: [SY11, SY03]
    # 규모를 재는 근거라서 원인 판정에 쓰지 않는다. 관측 필드가 없고 시나리오가 문장으로 정한다
    default_detail: 재화 유통량이 평소 범위다
  - id: E11
    name: "계정별 거래, 행동 집중도 조회"
    tool: query_account_activity
    performed_by: agent
    judged_by_team: TM11
    source_systems: [SY11, SY14, SY03]
    observations:
      concentration:
        default: spread
        values:
          spread: 거래와 행동이 여러 계정에 고르게 퍼져 있다
          concentrated: 소수 계정에 거래와 행동이 집중돼 있다
  - id: E12
    name: QA 재현 확인
    tool: request_qa_repro
    performed_by: human
    performed_by_team: TM08
    source_systems: [SY18, SY10]
    observations:
      reproduced:
        default: "no"
        values:
          # 재현 여부만 본다. 서버 문제인지 클라이언트 문제인지는 QA 재현으로 가르지 않는다
          "no": QA가 같은 조건에서 재현하지 못했다
          "yes": QA가 같은 조건에서 재현했다
  - id: E13
    name: 클라이언트 버전 분포 조회
    tool: query_client_version
    performed_by: agent
    source_systems: [SY08]
    observations:
      outdated_clients:
        default: absent
        values:
          absent: 모든 클라이언트가 최신 버전이다
          present: "최신 버전이 아닌 클라이언트가 남아 있다 (일부 유저 또는 전체 유저)"
  - id: E14
    name: "콘텐츠 일정 대조 (월드보스, 공성전 시간)"
    tool: query_content_schedule
    performed_by: agent
    source_systems: [SY15]
    observations:
      overlaps_large_content:
        default: "no"
        values:
          "no": 증상 시간대에 진행 중인 대규모 콘텐츠가 없다
          "yes": 증상 시간대가 대규모 콘텐츠 진행 시간과 겹친다
  # E15는 모든 증상의 영향 범위 추정(R3)과 중복 판정(R2)에 공통으로 쓴다.
  # 원인 판정에 쓰지 않아서 관측 필드가 없다. 시나리오가 문장으로 정한다.
  - id: E15
    name: "접수 내역 조회 (CS 문의, 커뮤니티 글)"
    tool: query_reports
    performed_by: agent
    source_systems: [SY06, SY07]
    default_detail: 같은 증상의 다른 접수 내역이 없다
