# 판정 근거 15개 (설계 3단계 6장).
# tool: 모의 도구(MCP)의 조회 기능 이름. 가상 데이터를 돌려준다.
# performed_by: agent 또는 human
# judged_by_team: 에이전트가 조회하고 최종 판단은 이 팀이 한다
# performed_by_team: 사람이 수행할 때 맡는 팀
# source_systems: 데이터 출처 시스템
evidence_checks:
  - {id: E01, name: 결제 기록 조회, tool: query_payment_record, performed_by: agent, source_systems: [SY02]}
  - {id: E02, name: "우편함, 보상 지급 기록 조회", tool: query_mailbox_log, performed_by: agent, source_systems: [SY13, SY03]}
  - {id: E03, name: 다른 타이틀 로그인 상태 확인, tool: check_cross_title_login, performed_by: agent, source_systems: [SY01, SY04]}
  - {id: E04, name: 서버 오류 로그 조회, tool: query_server_log, performed_by: agent, source_systems: [SY03]}
  - {id: E05, name: 게임 데이터 테이블 변경 이력 조회, tool: query_table_change, performed_by: agent, source_systems: [SY17]}
  - {id: E06, name: 배포 이력 조회, tool: query_deploy_history, performed_by: agent, source_systems: [SY08, SY03]}
  - {id: E07, name: "설정 변경 이력 조회 (이벤트, 상품)", tool: query_config_change, performed_by: agent, source_systems: [SY15, SY12]}
  - {id: E08, name: "공개 수치, 테이블 수치, 실제 결과 비교", tool: compare_probability, performed_by: agent, source_systems: [SY21, SY17, SY03]}
  - {id: E09, name: "자원, 네트워크 지표 조회", tool: query_resource_metrics, performed_by: agent, source_systems: [SY04, SY05]}
  - {id: E10, name: 재화 유통량 규모 산정, tool: query_currency_supply, performed_by: agent, judged_by_team: TM02, source_systems: [SY11, SY03]}
  - {id: E11, name: "계정별 거래, 행동 집중도 조회", tool: query_account_activity, performed_by: agent, judged_by_team: TM11, source_systems: [SY11, SY14, SY03]}
  - {id: E12, name: QA 재현 확인, tool: request_qa_repro, performed_by: human, performed_by_team: TM08, source_systems: [SY18, SY10]}
  - {id: E13, name: 클라이언트 버전 분포 조회, tool: query_client_version, performed_by: agent, source_systems: [SY08]}
  - {id: E14, name: "콘텐츠 일정 대조 (월드보스, 공성전 시간)", tool: query_content_schedule, performed_by: agent, source_systems: [SY15]}
  # E15는 모든 증상의 영향 범위 추정(R3)과 중복 판정(R2)에 공통으로 쓴다
  - {id: E15, name: "접수 내역 조회 (CS 문의, 커뮤니티 글)", tool: query_reports, performed_by: agent, source_systems: [SY06, SY07]}
