# 판단 규칙이 여는 절차 (설계 3단계 R1, R3, R7).
# 등급이나 원인에 걸린 그래프 관계(TRIGGERS, RESOLVED_BY)가 아니라 규칙에 걸리는 절차라서 그래프에 넣지 않고
# 시드 파일에만 둔다 (3단계 8장). 진단 에이전트, 시나리오 검증기, 채점기가 같은 값을 읽는다.
# 전에는 세 곳의 코드에 상수로 있었다 (M6에서 옮김, 5단계 12장)
rule_procedures:
  intake: P1               # R1: 모든 사건에서 연다 (장애 접수와 분류)
  escalation: P2           # R3: 등급이 상향되면 연다 (특정 등급이 아니라 상향이라는 사건에 걸린다)
  urgent_maintenance: P4   # R7: 아래 등급이면 원인 확정과 상관없이 연다 (긴급 점검)
  fix: P10                 # R7: 원인이 확정되면 연다 (원인 수정과 반영)

# R7: 긴급 점검(P4)을 열고 원인 수정(A15)을 긴급 점검으로 반영하는 등급. 나머지는 정기 점검에 반영한다
urgent_levels: [SEV1, SEV2]
