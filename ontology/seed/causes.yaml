# 원인 유형 21개 (설계 3단계 5장).
# located_in: LOCATED_IN 관계 (scope: logic, data, config, operation, execution. area는 systems.yaml 참고)
# checked_by: CHECKED_BY 관계
#   args: 판정 근거를 조회할 때 넘기는 값 (evidence_checks.yaml의 params)
#   when: 확정 조건. 판정 근거의 관측 필드가 이 값이어야 한다. 값이 목록이면 그중 하나면 된다
#         한 원인의 when이 모두 맞으면 확정, 하나라도 다르면 배제다
#   expect: 사람이 읽는 확정 조건 설명. when과 같은 뜻이어야 한다
#   note: 참고용 판정 근거라는 표시와 그 쓰임. when 대신 note가 있으면 확정과 배제에 쓰지 않는다.
#         원인을 살필 때 함께 보는 근거다 (예: 규모 산정, 먼저 살필 곳). 원인마다 확정 조건이 하나 이상 있어야 한다
#   C02, C15, C16, C17은 설계 문서에 적힌 조건이다.
#   나머지는 초안을 쓴 뒤 라이브 운영 경험이 있는 사람이 검토했다 (2026-11-23).
#   실제 운영 데이터로 확인한 조건이 아니다. 가정으로 남긴 것은 그 줄에 적었다
# resolved_by: RESOLVED_BY 관계. P10(원인 수정과 반영)은 모든 원인에 공통으로 연다.
causes:
  # S1 결제 후 아이템 미지급
  - id: C01
    name: "결제 승인, 기록 오류"
    aliases: []
    located_in: {system: SY02, scope: logic}
    checked_by:
      - {check: E01, when: {approval: [absent, error]}, expect: "결제 승인 기록이 없거나 승인 오류가 남아 있다"}
    resolved_by:
      - {procedure: P6, condition: 누락 보상}
      - {procedure: P3}
      - {procedure: P10}
  - id: C02
    name: 우편함 지급 누락
    aliases: []
    located_in: {system: SY13, scope: logic}
    checked_by:
      - {check: E01, when: {approval: present}, expect: 결제 승인 기록이 있다}
      - {check: E02, when: {delivery: absent}, expect: 우편함 지급 기록이 없다}
    resolved_by:
      - {procedure: P6}
      - {procedure: P3}
      - {procedure: P10}
  - id: C03
    name: 상품 설정 오류
    aliases: []
    located_in: {system: SY12, scope: config}
    checked_by:
      - {check: E07, args: {system: SY12}, when: {changed: "yes"}, expect: "증상 시작 전에 해당 상품의 설정 변경 이력이 있다"}
    resolved_by:
      - {procedure: P6}
      - {procedure: P3}
      - {procedure: P10}

  # S2 로그인 불가, 접속 장애
  - id: C04
    name: 공통 계정 인증 장애
    aliases: []
    located_in: {system: SY01, scope: operation}
    checked_by:
      # 가정: 다른 타이틀까지 로그인이 안 되면 공통 계정 인증 문제로 본다.
      # 인증 오류 메시지를 직접 확인하는 판정 근거는 MVP에 없다
      - {check: E03, when: {other_titles: failing}, expect: "다른 타이틀에서도 로그인이 실패한다"}
    resolved_by:
      - {procedure: P3}
      - {procedure: P4}
      - {procedure: P10}
  - id: C05
    name: 게임 로그인 서버 장애
    aliases: []
    located_in: {system: SY09, scope: logic}
    checked_by:
      - {check: E03, when: {other_titles: normal}, expect: "다른 타이틀 로그인은 정상이다"}
      - {check: E04, args: {system: SY09}, when: {error_log: present}, expect: "로그인 서버에 증상과 관련된 오류 로그가 있다"}
    resolved_by:
      - {procedure: P3}
      - {procedure: P4}
      - {procedure: P5}
      - {procedure: P10}
  - id: C06
    name: 서버 인프라 장애
    aliases: []
    located_in: {system: SY05, scope: operation}
    checked_by:
      - {check: E09, args: {system: SY05}, when: {status: [resource_limit, network_fault]}, expect: "서버 인프라의 자원 지표가 한계에 가깝거나 넘었다, 또는 네트워크 지표가 비정상이다"}
    resolved_by:
      - {procedure: P3}
      - {procedure: P4}
      - {procedure: P10}

  # S3 업데이트 후 콘텐츠 오류
  - id: C07
    name: 콘텐츠 테이블 값 오류
    aliases: []
    located_in: {system: SY17, scope: data, area: content}
    checked_by:
      - {check: E05, args: {area: content}, when: {changed: "yes"}, expect: "증상 시작 전에 해당 콘텐츠 테이블의 변경 이력이 있다"}
      - {check: E12, when: {reproduced: "yes"}, expect: "QA가 같은 조건에서 재현했다"}
    resolved_by:
      - {procedure: P5}
      - {procedure: P10}
  - id: C08
    name: 서버 적용 로직 오류
    aliases: []
    located_in: {system: SY10, scope: logic}
    checked_by:
      - {check: E04, args: {system: SY10}, when: {error_log: present}, expect: "월드 서버에 증상과 관련된 오류 로그가 있다"}
      - {check: E06, args: {system: SY10}, when: {deploy: [success, partial, failed]}, expect: "증상 시작 전에 서버 배포 이력이 있다"}
      - {check: E12, when: {reproduced: "yes"}, expect: "QA가 같은 조건에서 재현했다"}
    resolved_by:
      - {procedure: P4}
      - {procedure: P5}
      - {procedure: P10}
  - id: C09
    name: 클라이언트 로직 오류
    aliases: []
    # QA 재현은 재현 여부만 알려준다. 서버와 클라이언트가 함께 배포된 업데이트에서는
    # 판정 근거만으로 C08과 갈리지 않을 수 있다. 그때는 두 담당 팀을 함께 배정한다 (R5-4)
    located_in: {system: SY18, scope: logic}
    checked_by:
      - {check: E06, args: {system: SY18}, when: {deploy: [success, partial, failed]}, expect: "증상 시작 전에 클라이언트 패치 이력이 있다"}
      - {check: E12, when: {reproduced: "yes"}, expect: "QA가 같은 조건에서 재현했다"}
    resolved_by:
      - {procedure: P4}
      - {procedure: P10}
  - id: C10
    name: 패치 배포 실행 오류
    aliases: []
    # 배포를 실행하다 생긴 오류다. 빌드 오류와 런처 자체의 장애는 MVP에서 다루지 않는다.
    located_in: {system: SY08, scope: execution}
    checked_by:
      # 버전 분포만으로는 정상 배포 직후의 미업데이트 상태와 구분되지 않아 배포 이력을 함께 본다
      - {check: E06, args: {system: SY18}, when: {deploy: [failed, partial]}, expect: "증상 시작 전에 패치 배포 이력이 있고, 그 배포가 실패했거나 일부 대상에만 적용됐다"}
      - {check: E13, when: {outdated_clients: present}, expect: "배포가 끝난 뒤에도 최신 버전이 아닌 클라이언트가 남아 있다 (일부 유저 또는 전체 유저)"}
    resolved_by:
      - {procedure: P4}
      - {procedure: P10}

  # S4 이벤트 보상 오지급, 과지급
  - id: C11
    name: 이벤트 설정 오류
    aliases: []
    located_in: {system: SY15, scope: config}
    checked_by:
      - {check: E07, args: {system: SY15}, when: {changed: "yes"}, expect: "증상 시작 전에 이벤트 설정 변경 이력이 있다"}
    resolved_by:
      - {procedure: P6, condition: 미지급}
      - {procedure: P7, condition: 과지급}
      - {procedure: P3}
      - {procedure: P10}
  - id: C12
    name: 이벤트 지급 로직 오류
    aliases: []
    located_in: {system: SY15, scope: logic}
    checked_by:
      - {check: E02, when: {delivery: mismatch}, expect: "보상 지급 기록이 이벤트 설정과 다르다 (누락 또는 중복)"}
      - {check: E04, args: {system: SY15}, when: {error_log: present}, expect: "이벤트 시스템에 증상과 관련된 오류 로그가 있다 (지급 처리 오류)"}
    resolved_by:
      - {procedure: P6, condition: 미지급}
      - {procedure: P7, condition: 과지급}
      - {procedure: P3}
      - {procedure: P10}

  # S5 아이템 복사, 재화 비정상 증식
  - id: C13
    name: 복사 버그
    aliases: []
    located_in: {system: SY10, scope: logic}
    checked_by:
      - {check: E12, when: {reproduced: "yes"}, expect: "QA가 같은 조건에서 재현했다 (복사 재현)"}
      - {check: E04, args: {system: SY10}, when: {error_log: present}, expect: "월드 서버에 증상과 관련된 오류 로그가 있다"}
      # 유통량은 이벤트 같은 다른 요인으로도 늘 수 있고 "늘었다"의 기준이 없어 확정 조건으로 쓰지 않는다
      - {check: E10, note: "회수 범위를 정할 때 재화 유통량의 증가 규모를 본다"}
    resolved_by:
      - {procedure: P4}
      - {procedure: P5}
      - {procedure: P7}
      - {procedure: P10}
  - id: C14
    name: 어뷰징 (불법 프로그램, 악용)
    aliases: []
    located_in: {system: SY22, scope: config}  # 탐지 규칙이 잡지 못한 어뷰징
    checked_by:
      - {check: E11, when: {concentration: concentrated}, expect: "소수 계정에 거래와 행동이 집중돼 있다"}
      # 재화 유통량은 규모를 재는 근거다. 거래소 장애(S7)로 들어온 어뷰징은 유통량이 늘지 않아도 확정된다
      - {check: E10, note: "회수 범위를 정할 때 재화 유통량의 증가 규모를 본다"}
    resolved_by:
      - {procedure: P7}
      - {procedure: P4}
      - {procedure: P10}

  # S6 확률형 아이템 확률 표기 불일치
  # C15와 C16은 E08 결과가 같다. E05(테이블 변경 이력)로 가른다.
  - id: C15
    name: 공개 페이지 표기 오류
    aliases: []
    located_in: {system: SY21, scope: data}
    checked_by:
      - {check: E08, when: {public_vs_table: different, table_vs_actual: same}, expect: "공개 수치와 테이블 수치가 다르고, 테이블 수치와 실제 결과가 같다"}
      - {check: E05, args: {area: probability}, when: {changed: "no"}, expect: 증상 시작 전에 확률 테이블 변경 이력이 없다}
    resolved_by:
      - {procedure: P8}
      - {procedure: P3}
      - {procedure: P10}
  - id: C16
    name: 확률 테이블 값 오류
    aliases: []
    located_in: {system: SY17, scope: data, area: probability}
    checked_by:
      - {check: E08, when: {public_vs_table: different, table_vs_actual: same}, expect: "테이블 수치와 공개 수치가 다르고, 실제 결과와 테이블 수치가 같다"}
      - {check: E05, args: {area: probability}, when: {changed: "yes"}, expect: 증상 시작 전에 확률 테이블 변경 이력이 있다}
    resolved_by:
      - {procedure: P8}
      - {procedure: P3}
      - {procedure: P10}
  - id: C17
    name: 확률 모듈 로직 오류
    aliases: []
    located_in: {system: SY16, scope: logic}
    checked_by:
      - {check: E08, when: {public_vs_table: same, table_vs_actual: different}, expect: "테이블 수치와 공개 수치가 같은데, 실제 결과가 테이블 수치와 다르다"}
      # 설계는 E08만으로 판정한다. 배포 이력이 없어도 모듈 오류일 수 있어 확정 조건으로 두지 않는다
      - {check: E06, args: {system: SY16}, note: "증상 시작 전에 확률 모듈 배포 이력이 있으면 그 배포를 먼저 살핀다"}
    resolved_by:
      - {procedure: P8}
      - {procedure: P3}
      - {procedure: P4}
      - {procedure: P10}

  # S7 거래소 장애 (C14는 S5와 공유)
  - id: C18
    name: 거래소 서버 오류
    aliases: []
    located_in: {system: SY14, scope: logic}
    checked_by:
      - {check: E04, args: {system: SY14}, when: {error_log: present}, expect: "거래소에 증상과 관련된 오류 로그가 있다"}
      - {check: E06, args: {system: SY14}, when: {deploy: [success, partial, failed]}, expect: "증상 시작 전에 거래소 배포 이력이 있다"}
    resolved_by:
      - {procedure: P3}
      - {procedure: P4}
      - {procedure: P5}
      - {procedure: P10}
  - id: C19
    name: 게임 DB 부하
    aliases: []
    located_in: {system: SY11, scope: operation}
    checked_by:
      - {check: E09, args: {system: SY11}, when: {status: resource_limit}, expect: "게임 DB의 자원(부하) 지표가 한계에 가깝거나 넘었다"}
    resolved_by:
      - {procedure: P3}
      - {procedure: P4}
      - {procedure: P10}

  # S8 대규모 콘텐츠 중 서버 과부하
  - id: C20
    name: 서버 자원 부족
    aliases: []
    located_in: {system: SY05, scope: operation}
    checked_by:
      - {check: E09, args: {system: SY05}, when: {status: resource_limit}, expect: "서버 인프라의 자원 지표가 한계에 가깝거나 넘었다"}
      - {check: E14, when: {overlaps_large_content: "yes"}, expect: "대규모 콘텐츠 진행 시간과 겹친다"}
    resolved_by:
      - {procedure: P3}
      - {procedure: P4}
      - {procedure: P10}
  - id: C21
    name: 콘텐츠 처리 로직 비효율
    aliases: []
    located_in: {system: SY10, scope: logic}
    checked_by:
      - {check: E09, args: {system: SY05}, when: {status: [normal, network_fault]}, expect: "서버 인프라의 자원에는 여유가 있다"}
      - {check: E04, args: {system: SY10}, when: {delay_log: present}, expect: "특정 콘텐츠 처리 지연 로그가 있다"}
      - {check: E14, when: {overlaps_large_content: "yes"}, expect: "대규모 콘텐츠 진행 시간과 겹친다"}
    resolved_by:
      - {procedure: P3}
      - {procedure: P10}
