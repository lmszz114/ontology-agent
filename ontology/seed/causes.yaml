# 원인 유형 21개 (설계 3단계 5장).
# located_in: LOCATED_IN 관계 (scope: logic, data, config, operation. area는 systems.yaml 참고)
# checked_by: CHECKED_BY 관계. expect는 확정 조건 설명이다.
#   C02, C15, C16, C17은 설계 문서에 적힌 조건이다.
#   나머지는 초안이며 검토 전이다. 검토가 끝나면 이 줄을 지운다.
# resolved_by: RESOLVED_BY 관계. P10(원인 수정과 반영)은 모든 원인에 공통으로 연다.
causes:
  # S1 결제 후 아이템 미지급
  - id: C01
    name: "결제 승인, 기록 오류"
    aliases: []
    located_in: {system: SY02, scope: logic}
    checked_by:
      - {check: E01, expect: "결제 승인 기록이 없거나 승인 오류가 남아 있다"}
    resolved_by:
      - {procedure: P6, condition: 누락 보상}
      - {procedure: P3}
      - {procedure: P10}
  - id: C02
    name: 우편함 지급 누락
    aliases: []
    located_in: {system: SY13, scope: logic}
    checked_by:
      - {check: E01, expect: 결제 승인 기록이 있다}
      - {check: E02, expect: 우편함 지급 기록이 없다}
    resolved_by:
      - {procedure: P6}
      - {procedure: P3}
      - {procedure: P10}
  - id: C03
    name: 상품 설정 오류
    aliases: []
    located_in: {system: SY12, scope: config}
    checked_by:
      - {check: E07, expect: "증상 시작 전에 해당 상품의 설정 변경 이력이 있다"}
    resolved_by:
      - {procedure: P6}
      - {procedure: P3}
      - {procedure: P10}

  # S2 로그인 불가, 접속 장애
  - id: C04
    name: 공통 계정 인증 장애
    aliases: []
    located_in: {system: SY01, scope: operation}
    checked_by:
      - {check: E03, expect: "다른 타이틀에서도 로그인이 실패한다"}
    resolved_by:
      - {procedure: P3}
      - {procedure: P4}
      - {procedure: P10}
  - id: C05
    name: 게임 로그인 서버 장애
    aliases: []
    located_in: {system: SY09, scope: logic}
    checked_by:
      - {check: E03, expect: "다른 타이틀 로그인은 정상이다"}
      - {check: E04, expect: "로그인 서버에 오류 로그가 있다"}
    resolved_by:
      - {procedure: P3}
      - {procedure: P4}
      - {procedure: P5}
      - {procedure: P10}
  - id: C06
    name: 서버 인프라 장애
    aliases: []
    located_in: {system: SY05, scope: operation}
    checked_by:
      - {check: E09, expect: "서버 인프라의 자원 또는 네트워크 지표가 비정상이다"}
    resolved_by:
      - {procedure: P3}
      - {procedure: P4}
      - {procedure: P10}

  # S3 업데이트 후 콘텐츠 오류
  - id: C07
    name: 콘텐츠 테이블 값 오류
    aliases: []
    located_in: {system: SY17, scope: data, area: content}
    checked_by:
      - {check: E05, expect: "증상 시작 전에 해당 콘텐츠 테이블의 변경 이력이 있다"}
      - {check: E12, expect: "QA가 같은 조건에서 재현했다"}
    resolved_by:
      - {procedure: P5}
      - {procedure: P10}
  - id: C08
    name: 서버 적용 로직 오류
    aliases: []
    located_in: {system: SY10, scope: logic}
    checked_by:
      - {check: E04, expect: "월드 서버에 해당 콘텐츠 관련 오류 로그가 있다"}
      - {check: E06, expect: "증상 시작 전에 서버 배포 이력이 있다"}
      - {check: E12, expect: "QA가 같은 조건에서 재현했다"}
    resolved_by:
      - {procedure: P4}
      - {procedure: P5}
      - {procedure: P10}
  - id: C09
    name: 클라이언트 로직 오류
    aliases: []
    located_in: {system: SY18, scope: logic}
    checked_by:
      - {check: E06, expect: "증상 시작 전에 클라이언트 패치 이력이 있다"}
      - {check: E12, expect: "QA가 클라이언트에서 재현했다"}
    resolved_by:
      - {procedure: P4}
      - {procedure: P10}
  - id: C10
    name: 패치 배포 오류
    aliases: []
    located_in: {system: SY08, scope: operation}
    checked_by:
      - {check: E13, expect: "유저들의 클라이언트 버전이 섞여 있거나 최신이 아니다"}
    resolved_by:
      - {procedure: P4}
      - {procedure: P10}

  # S4 이벤트 보상 오지급, 과지급
  - id: C11
    name: 이벤트 설정 오류
    aliases: []
    located_in: {system: SY15, scope: config}
    checked_by:
      - {check: E07, expect: "증상 시작 전에 이벤트 설정 변경 이력이 있다"}
    resolved_by:
      - {procedure: P6, condition: 미지급}
      - {procedure: P7, condition: 과지급}
      - {procedure: P3}
      - {procedure: P10}
  - id: C12
    name: 이벤트 지급 로직 오류
    aliases: []
    located_in: {system: SY15, scope: logic}
    checked_by:
      - {check: E02, expect: "보상 지급 기록이 이벤트 설정과 다르다 (누락 또는 중복)"}
      - {check: E04, expect: "이벤트 지급 처리 오류 로그가 있다"}
    resolved_by:
      - {procedure: P6, condition: 미지급}
      - {procedure: P7, condition: 과지급}
      - {procedure: P3}
      - {procedure: P10}

  # S5 아이템 복사, 재화 비정상 증식
  - id: C13
    name: 복사 버그
    aliases: []
    located_in: {system: SY10, scope: logic}
    checked_by:
      - {check: E12, expect: "QA가 복사를 재현했다"}
      - {check: E04, expect: "월드 서버에 관련 오류 로그가 있다"}
      - {check: E10, expect: "재화 유통량이 평소보다 늘었다"}
    resolved_by:
      - {procedure: P4}
      - {procedure: P5}
      - {procedure: P7}
      - {procedure: P10}
  - id: C14
    name: 어뷰징 (불법 프로그램, 악용)
    aliases: []
    located_in: {system: SY22, scope: config}  # 탐지 규칙이 잡지 못한 어뷰징
    checked_by:
      - {check: E11, expect: "소수 계정에 거래와 행동이 집중돼 있다"}
      - {check: E10, expect: "재화 유통량이 평소보다 늘었다"}
    resolved_by:
      - {procedure: P7}
      - {procedure: P4}
      - {procedure: P10}

  # S6 확률형 아이템 확률 표기 불일치
  # C15와 C16은 E08 결과가 같다. E05(테이블 변경 이력)로 가른다.
  - id: C15
    name: 공개 페이지 표기 오류
    aliases: []
    located_in: {system: SY21, scope: data}
    checked_by:
      - {check: E08, expect: "공개 수치와 테이블 수치가 다르고, 테이블 수치와 실제 결과가 같다"}
      - {check: E05, expect: 증상 시작 전에 확률 테이블 변경 이력이 없다}
    resolved_by:
      - {procedure: P8}
      - {procedure: P3}
      - {procedure: P10}
  - id: C16
    name: 확률 테이블 값 오류
    aliases: []
    located_in: {system: SY17, scope: data, area: probability}
    checked_by:
      - {check: E08, expect: "테이블 수치와 공개 수치가 다르고, 실제 결과와 테이블 수치가 같다"}
      - {check: E05, expect: 증상 시작 전에 확률 테이블 변경 이력이 있다}
    resolved_by:
      - {procedure: P8}
      - {procedure: P3}
      - {procedure: P10}
  - id: C17
    name: 확률 모듈 로직 오류
    aliases: []
    located_in: {system: SY16, scope: logic}
    checked_by:
      - {check: E08, expect: "테이블 수치와 공개 수치가 같은데, 실제 결과가 테이블 수치와 다르다"}
      - {check: E06, expect: "증상 시작 전에 확률 모듈 배포 이력이 있다"}
    resolved_by:
      - {procedure: P8}
      - {procedure: P3}
      - {procedure: P4}
      - {procedure: P10}

  # S7 거래소 장애 (C14는 S5와 공유)
  - id: C18
    name: 거래소 서버 오류
    aliases: []
    located_in: {system: SY14, scope: logic}
    checked_by:
      - {check: E04, expect: "거래소에 오류 로그가 있다"}
      - {check: E06, expect: "증상 시작 전에 거래소 배포 이력이 있다"}
    resolved_by:
      - {procedure: P3}
      - {procedure: P4}
      - {procedure: P5}
      - {procedure: P10}
  - id: C19
    name: 게임 DB 부하
    aliases: []
    located_in: {system: SY11, scope: operation}
    checked_by:
      - {check: E09, expect: "게임 DB의 부하 지표가 비정상이다"}
    resolved_by:
      - {procedure: P3}
      - {procedure: P4}
      - {procedure: P10}

  # S8 대규모 콘텐츠 중 서버 과부하
  - id: C20
    name: 서버 자원 부족
    aliases: []
    located_in: {system: SY05, scope: operation}
    checked_by:
      - {check: E09, expect: "서버 인프라의 자원 지표가 한계에 가깝다"}
      - {check: E14, expect: "대규모 콘텐츠 진행 시간과 겹친다"}
    resolved_by:
      - {procedure: P3}
      - {procedure: P4}
      - {procedure: P10}
  - id: C21
    name: 콘텐츠 처리 로직 비효율
    aliases: []
    located_in: {system: SY10, scope: logic}
    checked_by:
      - {check: E09, expect: "서버 인프라의 자원에는 여유가 있다"}
      - {check: E04, expect: "특정 콘텐츠 처리 지연 로그가 있다"}
      - {check: E14, expect: "대규모 콘텐츠 진행 시간과 겹친다"}
    resolved_by:
      - {procedure: P3}
      - {procedure: P10}
