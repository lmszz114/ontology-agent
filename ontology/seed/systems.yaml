# 시스템 21개 (설계 2단계 3-1), 의존 관계 (2단계 3-2).
# 담당 팀 배정과 의존 관계는 모두 가정이다.
#
# owners: OWNS 관계. scope마다 관계 하나를 만든다.
#   scope: logic, data, config, operation, execution
#   area: 한 시스템의 같은 scope를 여러 팀이 나눠 맡을 때의 영역 구분
#   한 팀만 맡는 시스템은 logic, data, config, operation을 모두 그 팀에 둔다.
# depends_on: DEPENDS_ON 관계
systems:
  # 공통
  - id: SY01
    name: 통합 계정 인증
    category: 공통
    evidence_basis: [넥슨 확인]
    aliases: []
    owners:
      - {team: TM09, scopes: [logic, data, config, operation]}
    depends_on: []
  - id: SY02
    name: 결제 플랫폼
    category: 공통
    evidence_basis: [넥슨 확인]
    aliases: []
    owners:
      - {team: TM09, scopes: [logic, data, config, operation]}
    depends_on: []
  - id: SY03
    name: 로그 수집
    category: 공통
    evidence_basis: [일반 가정]
    aliases: []
    owners:
      - {team: TM10, scopes: [logic, data, config, operation]}
    depends_on: []
  - id: SY04
    name: 모니터링
    category: 공통
    evidence_basis: [일반 가정]
    aliases: []
    owners:
      - {team: TM10, scopes: [logic, data, config, operation]}
    depends_on: []
  - id: SY05
    name: 서버 인프라
    category: 공통
    evidence_basis: [일반 가정]
    aliases: []
    owners:
      - {team: TM10, scopes: [logic, data, config, operation]}
    depends_on: []
  - id: SY06
    name: CS 툴
    category: 공통
    evidence_basis: [일반 가정, 경험]
    aliases: []
    owners:
      - {team: TM07, scopes: [logic, data, config, operation]}
    depends_on: []
  - id: SY07
    name: 공식 커뮤니티
    category: 공통
    evidence_basis: [경험]
    aliases: []
    owners:
      - {team: TM07, scopes: [logic, data, config, operation]}
    depends_on: []
  - id: SY08
    name: 통합 런처(패치 서버)
    category: 공통
    evidence_basis: [넥슨 확인]
    aliases: []
    owners:
      - {team: TM09, scopes: [logic, data, config, operation]}
      - {team: TM10, scopes: [execution]}  # 패치 배포 실행
    depends_on: []

  # 게임. 모든 게임 시스템은 로그 수집(SY03)과 모니터링(SY04)에 의존한다.
  - id: SY09
    name: 로그인 서버(게이트웨이)
    category: 게임
    evidence_basis: [일반 가정]
    aliases: []
    owners:
      - {team: TM03, scopes: [logic, data, config, operation]}
    depends_on: [SY01, SY05, SY03, SY04]
  - id: SY10
    name: 월드 서버
    category: 게임
    evidence_basis: [일반 가정]
    aliases: []
    owners:
      - {team: TM03, scopes: [logic, data, config, operation]}
    depends_on: [SY11, SY17, SY05, SY03, SY04]
  - id: SY11
    name: 게임 DB
    category: 게임
    evidence_basis: [일반 가정]
    aliases: []
    owners:
      - {team: TM03, scopes: [logic, data, config]}
      - {team: TM10, scopes: [operation]}  # 운영
      - {team: TM11, scopes: [operation], area: abnormal_account_activity}  # 비정상 계정 활동
    depends_on: [SY05, SY03, SY04]
  - id: SY12
    name: 캐시 상점
    category: 게임
    evidence_basis: [일반 가정]
    aliases: []
    owners:
      - {team: TM03, scopes: [logic, data, operation]}
      - {team: TM06, scopes: [config]}  # 상품 설정
    depends_on: [SY02, SY13, SY03, SY04]
  - id: SY13
    name: 우편함
    category: 게임
    evidence_basis: [일반 가정]
    aliases: [메일함, 우편 시스템]
    owners:
      - {team: TM03, scopes: [logic, data, config, operation]}
    depends_on: [SY11, SY03, SY04]
  - id: SY14
    name: 거래소
    category: 게임
    evidence_basis: [일반 가정]
    aliases: []
    owners:
      - {team: TM03, scopes: [logic, data, operation]}
      - {team: TM02, scopes: [config]}  # 설계 (수수료, 등록 제한 정책 등)
    depends_on: [SY10, SY11, SY03, SY04]
  - id: SY15
    name: 이벤트 시스템
    category: 게임
    evidence_basis: [일반 가정]
    aliases: []
    owners:
      - {team: TM03, scopes: [logic, data, operation]}
      - {team: TM01, scopes: [config]}  # 설정 데이터
    depends_on: [SY17, SY13, SY03, SY04]
  - id: SY16
    name: 확률형 아이템 모듈
    category: 게임
    evidence_basis: [일반 가정]
    aliases: []
    owners:
      - {team: TM03, scopes: [logic, data, config, operation]}
    depends_on: [SY17, SY03, SY04]  # 확률 수치는 게임 데이터 테이블(SY17)에 있다
  - id: SY17
    name: 게임 데이터 테이블
    category: 게임
    evidence_basis: [경험]
    aliases: []
    owners:
      - {team: TM01, scopes: [data], area: content}      # 콘텐츠 영역 값
      - {team: TM02, scopes: [data], area: probability}  # 확률 영역 값
      - {team: TM03, scopes: [logic]}                    # 서버 적용 로직
    depends_on: [SY03, SY04]
  - id: SY18
    name: 게임 클라이언트
    category: 게임
    evidence_basis: [일반 가정]
    aliases: []
    owners:
      - {team: TM04, scopes: [logic, data, config, operation]}
    depends_on: [SY08, SY03, SY04]

  # 운영
  - id: SY19
    name: GM 툴
    category: 운영
    evidence_basis: [일반 가정]
    aliases: []
    owners:
      - {team: TM07, scopes: [execution]}  # 실행만. 결정과 승인은 절차 기준
    depends_on: []
  - id: SY20
    name: 공지 채널
    category: 운영
    evidence_basis: [일반 가정]
    aliases: []
    owners:
      - {team: TM07, scopes: [logic, data, config, operation]}
    depends_on: []
  - id: SY21
    name: "확률 정보 공개, 모니터링 페이지"
    category: 운영
    evidence_basis: [넥슨 확인]
    aliases: []
    owners:
      - {team: TM06, scopes: [logic, data, config, operation]}
    depends_on: [SY17, SY03]  # 표시 수치의 원본은 게임 데이터 테이블, 실제 결과는 로그 수집
