reports:
- channel: CH01
  reporter: U5201
  at: 2027-01-26T20:05+09:00
  text: 확률 안내 페이지에는 최고 등급 4%라고 적혀 있는데, 저는 이번 소환 300회 넘게 돌려서 최고 등급이 3번밖에 안 나왔어요. 제 운이 나쁜 건지 모르겠지만 표기 확률이랑 너무 차이 나는 것 같아서 한 번 확인 부탁드립니다.
- channel: CH01
  reporter: U5202
  at: 2027-01-26T20:07+09:00
  text: 20시 레이드 열리고 들어갔더니 렉이 너무 심해서 캐릭터가 몇 초씩 얼어붙네요. 스킬 눌러도 한참 뒤에 나가거나 아예 안 나가서 제대로 공략을 못 했습니다. 서버 쪽 문제인지 확인 부탁드려요.
- channel: CH02
  reporter: U5203
  at: 2027-01-26T20:12+09:00
  text: 안녕하세요. 이번 달 신규 소환 상품에서 최상급 등급 안내 확률이 4%로 표시되어 있는데, 저는 150회를 뽑는 동안 한 번도 나오지 않았습니다. 운이 나빴을 수도 있겠지만 혹시 실제 적용 확률이 안내와 같은지 확인 부탁드립니다.
- channel: CH03
  reporter: E5204
  at: 2027-01-26T20:15+09:00
  text: 레이드 오픈하고 나서부터 여러 월드에서 렉 제보가 계속 들어오고 있어요. 한두 월드만 그런 건 아닌 것 같은데, 서버 상태 한번 봐주실 수 있을까요?
