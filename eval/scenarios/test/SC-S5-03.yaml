  text: 22시쯤부터 경매장 골드 시세가 눈에 띄게 떨어지기 시작했어요. 몇몇 계정이 골드를 엄청 풀고 있는 걸 봤는데, 복사 같은 건 아닌지 걱정됩니다.
- channel: CH02
  reporter: U5501
  at: 2027-01-29T22:01+09:00
  text: 안녕하세요, 1:1 문의드립니다. 오늘 밤 10시경부터 골드 시세가 급락했고, 일부 계정이 골드를 대량으로 판매하는 것을 확인했습니다. 비정상적인 경로로 생긴 골드일 가능성이 있는지 확인 부탁드립니다.
- channel: CH01
  reporter: U5502
  at: 2027-01-29T22:02+09:00
  text: 지금 골드 시세 왜 이래요? 22시 지나고부터 갑자기 반토막 난 느낌인데 작업장이 터진 건지 복사인지 모르겠네요.
- channel: CH02
  reporter: U5503
  at: 2027-01-29T22:03+09:00
  text: 22시 무렵부터 거래소에서 골드 시세가 계속 내려가고 있습니다. 같은 시간대에 낯선 계정들이 골드를 수천만 단위로 올려놓는 걸 봤는데, 정상적인 거래인지 의문이 들어 문의드립니다.
- channel: CH01
  reporter: U5504
  at: 2027-01-29T22:04+09:00
  text: 저만 그런가요? 10시쯤부터 골드 가치가 확 떨어졌고 거래 채팅에 골드 대량 판매 글이 도배되고 있어요. 복사 버그 의심됩니다.
- channel: CH02
  reporter: U5505
  at: 2027-01-29T22:05+09:00
  text: 문의드립니다. 오늘 22시경부터 골드 시세가 급격히 무너졌고, 레벨이 낮은 계정 몇 개가 한꺼번에 많은 골드를 거래하는 모습을 봤습니다. 작업장일 수도 있다는 생각이 들어 조사를 요청드립니다.
- channel: CH01
  reporter: U5506
