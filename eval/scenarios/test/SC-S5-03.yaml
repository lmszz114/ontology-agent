  text: 정확한 원인은 모르겠지만 22시 이후로 골드 시세가 비정상적으로 떨어졌습니다. 제 눈엔 몇몇 계정이 골드를 대량으로 푸는 것처럼 보였고, 복사일지도 모른다는 생각이 들어 제보드립니다.
- channel: CH01
  reporter: U5514
  at: 2027-01-29T22:14+09:00
  text: 저 방금 거래소에서 골드 시세 보고 놀랐어요. 두 시간 전만 해도 멀쩡했는데 10시쯤부터 확 빠지고 있고, 골드 뿌리는 계정들이 눈에 띕니다.
- channel: CH02
  reporter: U5515
  at: 2027-01-29T22:15+09:00
  text: 문의드립니다. 오늘 22시 전후로 골드 가치가 급락했습니다. 신규 계정으로 보이는 캐릭터들이 대량의 골드를 거래하는 것을 여러 번 보았는데, 점검이 가능하다면 확인 부탁드립니다.
- channel: CH01
  reporter: U5516
  at: 2027-01-29T22:16+09:00
  text: 시세 박살났네요. 밤 10시부터 골드가 넘쳐나는 느낌이고 몇몇 계정이 계속 대량으로 팔고 있어요. 복사거나 작업장이거나 둘 중 하나 같은데 확인 좀 해주세요.
- channel: CH02
  reporter: U5517
  at: 2027-01-29T22:17+09:00
  text: 1:1로 제보드립니다. 22시경부터 서버 내 골드 시세가 눈에 띄게 하락했고, 일부 계정이 비정상적으로 많은 골드를 보유한 채 거래하는 모습을 확인했습니다. 단정할 수는 없지만 불법 복제나 작업장 가능성이 걱정됩니다.
