- channel: CH01
  reporter: U5512
  at: 2027-01-29T22:12+09:00
  text: 골드 시세 갑자기 왜 이렇게 내려가나요. 10시부터 이상했고 같은 닉네임 패턴 계정이 계속 골드 판다고 외치던데, 작업장 같아 보여요.
- channel: CH02
  reporter: U5513
