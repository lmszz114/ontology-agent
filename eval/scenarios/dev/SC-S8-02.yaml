reports:
- channel: CH01
  reporter: U8300
  at: 2026-12-19T21:00+09:00
  text: 3월드 공성전 시작하고 나서부터 렉이 너무 심해요. 스킬 누르면 3~4초 뒤에 나가고 옆에 있던 사람들은 순간이동하듯 왔다갔다 합니다.
- channel: CH02
  reporter: U8301
  at: 2026-12-19T21:01+09:00
  text: 안녕하세요. 3월드에서 공성전 진행 중에 스킬 사용이 몇 초씩 지연되는 현상을 겪었습니다. 같은 시간대에 혈맹원 두 명은 접속이 끊겼다고 했는데, 저는 끊기지는 않았습니다. 확인 부탁드립니다.
- channel: CH01
  reporter: U8302
  at: 2026-12-19T21:02+09:00
  text: 공성 시작하자마자 화면이 뚝뚝 끊기더니 제 캐릭터가 뒤로 쭉 끌려갔어요. 평소엔 이런 적 없는데 공성전 때만 이러네요.
- channel: CH01
  reporter: U8303
  at: 2026-12-19T21:03+09:00
  text: 3월드 공성전 중에 튕김이 계속 발생했습니다. 저는 20분 동안 세 번 로그인 화면으로 돌아갔고, 다시 들어가면 성문 앞에서 이미 상황이 끝나 있었습니다. 제 쪽 인터넷 문제인지는 모르겠지만 같은 혈맹원도 비슷하게 겪었다고 합니다.
- channel: CH01
  reporter: U8304
  at: 2026-12-19T21:04+09:00
  text: 공성전만 하면 핑이 갑자기 올라가는 것 같아요. 평소 40 정도인데 공성 시작 후에 게임 내 표시가 500 넘게 찍혔습니다.
- channel: CH02
  reporter: U8305
  at: 2026-12-19T21:05+09:00
  text: 문의드립니다. 오늘 3월드 공성전 시작 직후부터 스킬 버튼을 눌러도 반응이 한참 늦게 나타났습니다. 물약도 눌렀는데 몇 초 뒤에야 먹혀서 죽을 뻔했습니다.
- channel: CH01
  reporter: U8306
  at: 2026-12-19T21:06+09:00
  text: 다른 월드에서는 렉 없는데 3월드 공성만 렉이 장난 아니네요. 상대 길드원들이 깜빡깜빡 사라졌다 나타나서 타겟팅도 안 잡혔습니다.
- channel: CH01
  reporter: U8307
  at: 2026-12-19T21:07+09:00
  text: 저만 그런 건지 모르겠는데 공성 시작하고 나서 이동하다가 갑자기 제자리로 돌아오는 현상이 계속 반복됐어요. 몇 번이나 성벽 위에서 땅으로 떨어진 것처럼 위치가 바뀌었습니다.
- channel: CH02
  reporter: U8308
  at: 2026-12-19T21:08+09:00
  text: 안녕하세요. 3월드 공성전 도중 화면이 3~5초 정도 멈췄다가 풀렸는데, 풀리고 나니 캐릭터가 이미 죽어 있었습니다. 같은 현상이 세 번 이상 반복되었고 시간은 대략 저녁 9시 전후였습니다. 확인해 주시면 감사하겠습니다.
- channel: CH01
  reporter: U8309
  at: 2026-12-19T21:09+09:00
  text: 공성 때마다 이러면 참여를 못 해요 ㅠㅠ 스킬이 눌러지긴 하는데 이펙트가 한참 뒤에 나오고, 데미지는 그보다 더 늦게 들어갑니다.
- channel: CH01
  reporter: U8310
  at: 2026-12-19T21:10+09:00
  text: 3월드 공성전 시작되고 채팅창에서도 다들 렉 얘기뿐이었습니다. 저는 캐릭터가 순간이동처럼 튀는 증상이었고, 옆 사람은 아예 서버 연결이 끊겼다고 하더라고요.
- channel: CH02
  reporter: U8311
  at: 2026-12-19T21:11+09:00
  text: 1:1 문의 드립니다. 3월드 공성 참여 중 스킬 시전이 평소보다 많이 느렸고, 제 캐릭터 위치가 계속 뒤로 밀리는 현상이 있었습니다. 제 쪽 네트워크는 다른 게임이나 영상 시청에는 문제가 없었습니다.
- channel: CH01
  reporter: U8312
  at: 2026-12-19T21:12+09:00
  text: 공성 시작 10분쯤 지나니까 렉이 더 심해졌어요. 처음엔 스킬만 늦게 나가다가 나중엔 몬스터랑 사람이 전부 제자리에서 멈춰 보였습니다.
- channel: CH01
  reporter: U8313
  at: 2026-12-19T21:13+09:00
  text: 저희 혈맹원 중에 다섯 명 정도가 공성 중에 강제 종료됐다고 합니다. 저는 튕기진 않았지만 이동이 계속 끊겨서 제대로 싸우지 못했습니다.
- channel: CH01
  reporter: U8314
  at: 2026-12-19T21:14+09:00
  text: 이번 3월드 공성전은 렉 때문에 게임이 안 됐습니다. 공격 스킬이 나가는 데 2초 넘게 걸렸고, 다시 눌렀더니 두 번 연속으로 발동돼서 마나만 날렸어요.
- channel: CH02
  reporter: U8315
  at: 2026-12-19T21:15+09:00
  text: 확인 요청드립니다. 3월드 공성전 시작 후 캐릭터가 걷다가 갑자기 몇 칸 앞으로 이동하는 현상이 자주 있었습니다. 같은 시간에 월드 채팅에도 비슷한 증상을 말하는 분들이 여러 명 있었습니다.
- channel: CH01
  reporter: U8316
  at: 2026-12-19T21:16+09:00
  text: 3월드 공성 중에 로그아웃된 뒤 재접속하려니까 한동안 접속 대기가 걸렸습니다. 들어가고 나서도 스킬이 늦게 나가서 결국 공성 끝까지 제대로 못 했네요.
- channel: CH01
  reporter: U8317
  at: 2026-12-19T21:17+09:00
  text: 렉이 심해서 성문 부수는 타이밍을 완전히 놓쳤어요. 제가 누른 순간과 실제로 스킬이 나간 순간이 거의 4초 차이 났습니다.
- channel: CH02
  reporter: U8318
  at: 2026-12-19T21:18+09:00
  text: 안녕하세요, 3월드 유저입니다. 오늘 공성 시작 이후 캐릭터 이동 중 렉이 걸려서 같은 자리를 몇 번 왔다갔다 하는 현상이 있었습니다. 원인은 잘 모르겠지만 공성 때만 이런 것 같아 제보드립니다.
- channel: CH01
  reporter: U8319
  at: 2026-12-19T21:19+09:00
  text: 공성 중 상대 캐릭터가 이리저리 순간이동해서 때릴 수가 없었어요. 저는 튕기진 않았는데 제 화면에서만 그런 건지 다른 분들도 그런지 궁금합니다.
