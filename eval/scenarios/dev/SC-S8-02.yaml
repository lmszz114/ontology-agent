# 심각도 변화: 같은 문제의 접수가 30분 안에 20건 들어와 등급이 한 단계 오른다 (R3 상향). 원인은 콘텐츠 처리 로직 비효율.
# 2026-11-24 M3 추가. 진단 프롬프트보다 늦게 만든 시나리오다. 정답 라벨은 에이전트 실행 전에 고정하고 사용자가 검토한다 (4단계 4-2, M3 결정)
