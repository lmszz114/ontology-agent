text_source: 'Sonnet 5.5 생성(eval/generate_reports.py, report-gen-v1) 후보 중 선택. 선택과 정답 라벨: 사용자 확인 (2026-11-24, 에이전트 실행 전)'
reports:
- channel: CH01
  reporter: U3200
  at: '2026-12-20T10:30:00+09:00'
  text: 2월드인데 오늘 점검 끝나고부터 퀘스트 완료 보상 받기 누르면 오류창 뜨면서 진행이 안 돼요. 다른 월드 하는 친구는 멀쩡하다는데 저희 월드만 이런 건가요?
- channel: CH02
  reporter: U3201
  at: '2026-12-20T10:32:22+09:00'
  text: 안녕하세요. 2월드에서 플레이 중인데 오늘 점검 이후 특정 퀘스트의 '보상 받기' 버튼을 누르면 오류 메시지가 나오고 퀘스트가 완료 처리되지 않습니다. 같은 퀘스트를 다른 월드에서 하는 지인은 정상이라고 하여 문의드립니다.
- channel: CH01
  reporter: U3202
  at: '2026-12-20T10:34:44+09:00'
  text: 점검 끝나고 보상 받기 눌렀더니 바로 오류 뜸. 몇 번을 눌러도 똑같고 퀘스트는 그대로 완료 대기 상태임. 친구는 다른 월드라 되던데 2월드만 그런 건지 궁금하네요
- channel: CH02
  reporter: U3203
  at: '2026-12-20T10:37:06+09:00'
  text: 문의드립니다. 오늘 정기 점검이 끝난 뒤부터 2월드 제 캐릭터가 퀘스트 완료 보상을 수령하려고 하면 오류가 발생합니다. 재접속도 해봤지만 같은 현상이 반복되었고, 타 월드 친구는 문제가 없다고 했습니다.
- channel: CH01
  reporter: U3204
  at: '2026-12-20T10:39:28+09:00'
  text: 저만 이런가요? 2월드 퀘스트 보상 받기 버튼 누르면 오류 나고 다음 단계로 안 넘어가요. 점검 전에는 이런 적 없었는데 점검 후부터 이러네요.
- channel: CH02
  reporter: U3205
  at: '2026-12-20T10:41:50+09:00'
  text: 안녕하세요, 2월드 이용 중인 유저입니다. 점검 종료 이후 특정 퀘스트에서 완료 보상 버튼을 눌렀을 때 오류 팝업이 뜨고 퀘스트가 계속 진행 중으로 남아 있습니다. 확인 부탁드립니다.
- channel: CH01
  reporter: U3206
  at: '2026-12-20T10:44:12+09:00'
  text: 2월드 퀘스트 완료가 안 됩니다. 보상 받기 누르면 오류 뜨고 끝이에요. 다른 월드 친구한테 물어보니 자기는 잘 받았대요.
- channel: CH02
  reporter: U3207
  at: '2026-12-20T10:46:34+09:00'
  text: 1:1 문의 남깁니다. 오늘 점검 끝난 뒤로 2월드에서 진행하던 퀘스트의 보상 받기를 누르면 오류가 나서 완료가 되지 않습니다. 캐릭터 재접속과 클라이언트 재시작을 해봐도 동일했습니다.
- channel: CH01
  reporter: U3208
  at: '2026-12-20T10:48:56+09:00'
  text: 혹시 2월드 다른 분들도 퀘스트 보상 안 받아지시나요? 저는 점검 끝나고부터 버튼 누르면 오류 나오고 퀘스트가 그대로예요. 다른 월드 길드원은 문제없다고 하네요.
- channel: CH02
  reporter: U3209
  at: '2026-12-20T10:51:18+09:00'
  text: 안녕하세요. 점검 이후 2월드에서 특정 퀘스트 완료 시 보상 수령 단계에서 오류가 발생하여 다음 진행이 막혀 있습니다. 다른 월드에서는 정상 진행된다고 들었으며, 빠른 확인 부탁드립니다.
- channel: CH01
  reporter: U3210
  at: '2026-12-20T10:53:40+09:00'
  text: 점검 끝났다길래 접속해서 퀘스트 마무리하려는데 보상 받기 누르자마자 오류 팝업이 뜹니다. 몇 번 더 눌러봐도 마찬가지라 퀘스트를 못 끝내고 있어요.
- channel: CH01
  reporter: U3211
  at: '2026-12-20T10:56:02+09:00'
  text: 2월드 유저입니다. 오늘 점검 후에 퀘스트 보상 받기를 누르면 오류가 나고 퀘스트 상태가 안 바뀝니다. 같은 퀘스트를 다른 월드 친구가 방금 클리어했다고 해서 월드 문제인가 싶기도 한데 정확한 건 모르겠습니다.
- channel: CH01
  reporter: U3212
  at: '2026-12-20T10:58:24+09:00'
  text: 보상 받기 오류 저만 나는 건가요ㅠ 점검 끝나고부터 계속 이래요. 2월드고요, 타 월드 친구는 잘 된다고 하네요.
- channel: CH02
  reporter: U3213
  at: '2026-12-20T11:00:46+09:00'
  text: 문의 드립니다. 점검 종료 후 2월드에서 한 퀘스트의 완료 보상을 받으려 할 때마다 오류 안내가 나옵니다. 인벤토리 여유 공간은 충분한 상태이고, 재접속 후에도 똑같습니다.
- channel: CH01
  reporter: U3214
  at: '2026-12-20T11:03:08+09:00'
  text: 점검 후 2월드 퀘스트가 보상 단계에서 막혔어요. 버튼 누르면 오류 나고 퀘스트는 완료 처리가 안 되네요. 친구는 월드가 달라서 그런지 문제없이 받았다고 합니다.
- channel: CH02
  reporter: U3215
  at: '2026-12-20T11:05:30+09:00'
  text: 안녕하세요. 오늘 점검이 끝난 뒤 2월드에서 퀘스트 보상 받기 버튼을 누르면 오류가 나고 이후 진행이 되지 않습니다. 월드를 옮겨서 해본 건 아니라서 정확한 범위는 모르겠지만, 다른 월드의 친구는 괜찮다고 했습니다.
- channel: CH01
  reporter: U3216
  at: '2026-12-20T11:07:52+09:00'
  text: 퀘스트 완료 버튼 누르면 오류 뜨는데 이거 저만 그런가요? 점검 전엔 같은 퀘스트 앞단계까지 잘 됐는데 오늘 점검 끝나고부터 막혔어요. 2월드입니다.
- channel: CH01
  reporter: U3217
  at: '2026-12-20T11:10:14+09:00'
  text: 2월드 점검 이후로 퀘스트 보상 수령 오류가 납니다. 오류가 뜬 다음에도 퀘스트는 계속 완료 가능 상태로 남아 있고, 다시 눌러도 같은 오류가 반복돼요.
- channel: CH02
  reporter: U3218
  at: '2026-12-20T11:12:36+09:00'
  text: 1:1 문의입니다. 2월드 캐릭터로 오늘 점검 후 퀘스트를 완료하려고 보상 받기를 눌렀는데 오류 창이 뜨며 진행이 되지 않습니다. 다른 월드에서 플레이하는 지인은 같은 구간이 문제없다고 해서 함께 말씀드립니다.
- channel: CH01
  reporter: U3219
  at: '2026-12-20T11:14:58+09:00'
  text: 점검 끝나고 들어왔더니 퀘스트 보상이 안 받아져요. 누르면 오류 나오고 그게 다예요. 다른 월드는 된다던데 2월드만 따로 확인 한번 부탁드려요.
