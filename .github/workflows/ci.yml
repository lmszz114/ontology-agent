name: CI

# PR마다 단위 테스트를 돌린다. LLM 호출은 없다.
# 시나리오 회귀 테스트는 별도 워크플로로 추가한다 (설계 5단계 3-2).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      neo4j:
        image: neo4j:2026.10.2-community
        ports:
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/localdev-password
        options: >-
          --health-cmd "cypher-shell -u neo4j -p localdev-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: localdev-password
      # Neo4j에 연결하지 못하면 건너뛰지 않고 실패시킨다
      REQUIRE_NEO4J: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: uv 설치
        run: pip install uv
      - name: 의존성 설치
        run: uv sync --frozen
      - name: 스키마 적용
        run: uv run python -m ontology.apply_schema
      - name: 시드 적재
        run: uv run python -m ontology.load
      - name: 테스트
        run: uv run pytest -v
