# 가상 회사 B의 조직 설정 (설계 4단계 2-4 조직별 배포 검증, 2단계 2-3, 2-4).
# 가상 회사 A와 채널, 역할 배정만 다르다. 시드(팀, 역할, 시스템, 원인, 절차)와 에이전트 코드는 같다.
# - 공식 커뮤니티 채널(CH01) 없이 자체 접수 시스템(CH02)으로만 유저 제보를 받는다
# - 접수 분류 담당(RL03)을 개발PM팀이 아니라 게임서비스팀이 맡는다
# 바꾼 두 가지는 가정이다. 같은 에이전트가 설정만 바꿔 1차 처리 역할과 배정을 다르게 내는지 보려고 정했다
org:
  id: org-b
  name: 가상 회사 B

# Channel 노드와 HANDLED_FIRST_BY 관계
channels:
  - {id: CH02, name: 자체 접수 시스템, kind: user, source_system: SY06, handled_first_by: RL02}
  - {id: CH03, name: "사내 메신저, 메일", kind: internal, source_system: null, handled_first_by: RL03}
  - {id: CH04, name: JSM 티켓, kind: internal, source_system: null, handled_first_by: RL03}

# ASSIGNED_TO 관계 (Role -> Team). 공식 커뮤니티가 없어 CM(RL01)은 맡는 팀이 없다
role_assignments:
  - {role: RL02, team: TM07}
  - {role: RL03, team: TM07}  # 가상 회사 A는 개발PM팀(TM05)
  - {role: RL05, team: TM07}
